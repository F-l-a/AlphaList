<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Language" content="en">
    <meta name="google" content="notranslate">
    <title>AlphaList</title>
    <link rel="manifest" id="manifest-link" href="assets/site.webmanifest">
    <meta name="theme-color" content="#212529">
    <link rel="icon" id="favicon-link" href="assets/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" id="apple-touch-icon-link" href="assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" id="favicon-32x32-link" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" id="favicon-16x16-link" href="assets/favicon-16x16.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <script>
        (function(){
            // Function to get the base URL, handling GitHub Pages subfolder
            function getBaseUrl() {
                const path = window.location.pathname;
                if (path.includes('/AlphaList/')) {
                    return '/AlphaList';
                } else {
                    return '';
                }
            }

            window.BASE_URL = getBaseUrl(); // Make BASE_URL global
            window.preloadedUiTranslations = null;
            window.preloadedLanguage = '';

            function applyPreloadedUiTranslations(translations) {
                if (!translations) return;

                document.querySelectorAll('[data-i18n]').forEach(function(el) {
                    var key = el.dataset.i18n;
                    el.textContent = translations[key] || key;
                });

                document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) {
                    var key = el.dataset.i18nPlaceholder;
                    el.placeholder = translations[key] || key;
                });

                document.querySelectorAll('[data-i18n-aria-label]').forEach(function(el) {
                    var key = el.dataset.i18nAriaLabel;
                    el.setAttribute('aria-label', translations[key] || key);
                });

                document.querySelectorAll('[data-i18n-alt]').forEach(function(el) {
                    var key = el.dataset.i18nAlt;
                    el.setAttribute('alt', translations[key] || key);
                });
            }

            window.addEventListener('DOMContentLoaded', async function(){
                // Update link hrefs with BASE_URL after DOM is ready
                document.getElementById('manifest-link').href = `${window.BASE_URL}/assets/site.webmanifest`;
                document.getElementById('favicon-link').href = `${window.BASE_URL}/assets/favicon.ico`;
                document.getElementById('apple-touch-icon-link').href = `${window.BASE_URL}/assets/apple-touch-icon.png`;
                document.getElementById('favicon-32x32-link').href = `${window.BASE_URL}/assets/favicon-32x32.png`;
                document.getElementById('favicon-16x16-link').href = `${window.BASE_URL}/assets/favicon-16x16.png`;

                try {
                    var select = document.getElementById('lang-select');
                    if (select && document.documentElement.lang) {
                        select.value = document.documentElement.lang;
                    }
                } catch (e) {}

                try {
                    var translations = await window.initialUiTranslationsPromise;
                    applyPreloadedUiTranslations(translations);
                } catch (e) {}

                try { document.body.classList.remove('theme-loading'); } catch(e) {}
            });
            
            // Apply stored theme (or system preference) immediately to avoid FOUC
            try {
                var stored = null;
                try { stored = localStorage.getItem('theme'); } catch (e) { stored = null; }
                var theme = stored || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-bs-theme', theme);
            } catch (e) {}

            // Apply stored language immediately
            try {
                var storedLang = null;
                try { storedLang = localStorage.getItem('language'); } catch (e) { storedLang = null; }
                if (storedLang) {
                    document.documentElement.setAttribute('lang', storedLang);
                }
            } catch (e) {}

            window.initialUiTranslationsPromise = (async function() {
                try {
                    var preloadLang = document.documentElement.lang || 'en';
                    window.preloadedLanguage = preloadLang;

                    if (!preloadLang || preloadLang === 'en' || preloadLang.indexOf('en-') === 0) {
                        return null;
                    }

                    var extraUrl = `${window.BASE_URL}/translations/Extra/extra-${preloadLang.toLowerCase()}.json`;
                    var response = await fetch(extraUrl);
                    if (!response.ok) {
                        return null;
                    }

                    var extraJson = await response.json();
                    var uiTranslations = extraJson && extraJson.add_translation && extraJson.add_translation.translations;
                    if (uiTranslations && typeof uiTranslations === 'object' && !Array.isArray(uiTranslations)) {
                        window.preloadedUiTranslations = uiTranslations;
                        return uiTranslations;
                    }
                } catch (e) {}

                return null;
            })();
        })();
    </script>
</head>
    <body class="theme-loading notranslate" translate="no">
    <div id="initial-loader" class="initial-loader" aria-live="polite" aria-label="Loading">
        <div class="spinner-border initial-loader-spinner" role="status" aria-hidden="true"></div>
        <span class="initial-loader-text">Loading</span>
    </div>
    <header class="bg-dark text-white p-2 mb-1">
        <div class="container">
            <h1 class="h3" data-i18n="[PokéMMO] Pokémon Alpha List">[PokéMMO] Pokémon Alpha List</h1>
            <div class="row g-3 align-items-center">
                <div class="col-md-4">
                    <input type="text" id="search-pokemon" class="form-control" placeholder="Search Pokémon..." data-i18n-placeholder="Search Pokémon...">
                </div>
                <div class="col-sm-6 col-md-3">
                    <select id="region-select" class="form-select">
                        <option value="all" data-i18n="All Regions">All Regions</option>
                    </select>
                </div>
                <div class="col-sm-6 col-md-3">
                    <input class="form-control" list="location-datalist-options" id="location-select" placeholder="All Locations" data-i18n-placeholder="All Locations">
                    <datalist id="location-datalist-options">

                    </datalist>
                </div>
                <div class="col-md-2">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="grouping-switch">
                        <label class="form-check-label" for="grouping-switch" data-i18n="Group by Poke">Group by Poke</label>
                    </div>
                </div>
            </div>
        </div>
    </header>
   <hr class="mt-0 mb-2"> 

    <main class="container">
        <div id="content" class="accordion">
        </div>
    </main>

    <footer class="footer mt-auto py-2 bg-dark text-white-50">
        <div class="container text-center d-flex flex-column flex-md-row justify-content-between align-items-center">
            <small class="mb-2 mb-md-0 flex-grow-1 text-md-start">Alpha List by FlaProGmr - <a href="https://docs.google.com/spreadsheets/d/11MT793njqK8dSIFob-k_T1tCeoUQnGO8ELPDAGbOmAw/" target="_blank" rel="noopener" class="text-white-50" data-i18n="Original data">Original data</a> by ZzPSYCHOzZ | Updated 01/2026 | <a href="https://github.com/F-l-a/AlphaList" target="_blank" rel="noopener" class="text-white-50" data-i18n="Contribute">Contribute</a></small>
            <div class="d-flex flex-row gap-1 align-items-center">
                <select id="lang-select" class="form-select form-select-sm w-auto py-0 lang-select" aria-label="Select language">
                    <option value="en" selected>🇬🇧 EN</option>
                    <option value="it">🇮🇹 IT</option>
                    <option value="es">🇪🇸 ES</option>
                    <option value="fr">🇫🇷 FR</option>
                </select>
                <button id="theme-toggle-btn" class="btn btn-link text-white-50 d-flex align-items-center p-0">
                    <i class="bi bi-sun fs-5"></i>
                </button>  
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Map preview modal -->
    <div class="modal fade" id="mapModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" data-i18n="Map Preview">Map Preview</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" data-i18n-aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <div id="mapModalPlaceholder" class="d-flex justify-content-center align-items-center my-3">
                        <div id="mapModalSpinner" class="spinner-border" role="status" aria-hidden="true">
                            <span class="visually-hidden" data-i18n="Loading...">Loading...</span>
                        </div>
                    </div>
                    <img id="mapModalImg" src="" alt="Map preview" class="img-fluid d-none" data-i18n-alt="Map preview" />
                </div>
                <div class="modal-footer">
                    <a id="mapModalOpenBtn" class="btn btn-primary d-none" target="_blank" rel="noopener" data-i18n="Open image in new tab">Open image in new tab</a>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
